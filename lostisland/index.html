<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lost Island</title><!-- li-v4 -->
<meta name="description" content="Eine kleine Insel im All – tippe, wohin Lila laufen soll.">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lost Island">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0e1a}
body{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;color:#c8d4e8}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-4%;background:#0a0e1a center/cover no-repeat;background-image:url(img/stars.jpg);
  will-change:transform;filter:brightness(.88) contrast(1.08)}
#fx,#water{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#moon{position:absolute;left:0;top:0;width:min(22vw,130px);height:min(22vw,130px);will-change:transform;pointer-events:none;
  filter:drop-shadow(0 0 22px rgba(255,236,170,.4))}
#moon img{width:100%;height:100%;display:block}
#birds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vbird{position:absolute;color:rgba(210,220,235,.5);font-weight:800;font-size:15px;letter-spacing:-1px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);will-change:transform}
#world{position:absolute;left:50%;top:54%;width:min(94vw,760px);aspect-ratio:720/633;
  transform:translate(-50%,-50%);will-change:transform}
#islandBase,#islandFull{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 20px 32px rgba(0,0,0,.5))}
#islandFull{opacity:0;pointer-events:none} /* fallback ref */
#canopy{position:absolute;left:6.35%;top:15.97%;width:49.16%;height:auto;transform-origin:55% 95%;
  will-change:transform;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
#canopy img{width:100%;height:auto;display:block;-webkit-user-drag:none}   /* on red bench under willow */     /* at lighthouse door */       /* open grass mid */
.creature{position:absolute;will-change:transform;pointer-events:none;z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.creature img{width:100%;height:auto;display:block;-webkit-user-drag:none}
#pet{left:14%;top:56%;width:11%;display:none}
#squirrel{left:34%;top:34%;width:8%;display:none}
#pet.on,#squirrel.on{display:block}

#hero{position:absolute;left:48%;top:42%;width:24%;aspect-ratio:1/1.35;z-index:6;
  transform:translate(-50%,-70%);will-change:left,top,transform;pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(40,20,60,.35))}
#hero canvas{width:100%;height:100%;display:block}
#hero.hidden{opacity:0}
#hitDoor{position:absolute;left:64%;top:42%;width:12%;height:18%;z-index:2;pointer-events:none}

#title{position:absolute;left:calc(12px + var(--safe-l));bottom:calc(10px + var(--safe-b));
  font-size:11px;letter-spacing:.14em;color:rgba(180,198,220,.34);font-weight:700;pointer-events:none;z-index:8}
#gear{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));z-index:9;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(180,200,230,.16);
  background:rgba(10,14,26,.4);backdrop-filter:blur(10px);color:rgba(200,214,235,.55);
  font-size:18px;display:grid;place-items:center;cursor:pointer}
#gear:active{transform:scale(.94)}
#panel{position:absolute;right:calc(10px + var(--safe-r));top:calc(54px + var(--safe-t));z-index:9;
  width:min(220px,70vw);padding:12px 14px;border-radius:14px;background:rgba(8,12,22,.88);
  border:1px solid rgba(180,200,230,.14);backdrop-filter:blur(14px);box-shadow:0 10px 32px rgba(0,0,0,.4);
  display:none;font-size:13px;color:rgba(210,220,235,.88)}
#panel.open{display:block}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
#panel .lbl{opacity:.75;font-size:12px;letter-spacing:.04em}
#panel button{appearance:none;border:1px solid rgba(180,200,230,.22);background:rgba(255,255,255,.06);
  color:rgba(220,230,245,.92);border-radius:999px;padding:5px 11px;font:inherit;font-weight:700;font-size:11px;
  letter-spacing:.05em;cursor:pointer;min-width:52px}
#panel button.on{background:rgba(140,180,220,.2);border-color:rgba(160,200,240,.4)}
#panel input[type=range]{width:100px;accent-color:#9ab4d4}
#panel .hint{margin-top:8px;font-size:10px;line-height:1.4;color:rgba(170,185,210,.4)}
.bub{position:absolute;padding:.32em .72em;border-radius:1.15em;background:rgba(255,255,255,.93);color:#3a4560;
  font-weight:700;font-size:13px;box-shadow:0 3px 14px rgba(0,0,0,.28);white-space:nowrap;pointer-events:none;
  transform:translate(-50%,-100%);animation:bub 1.45s ease-out forwards;z-index:7}
.bub::after{content:"";position:absolute;left:36%;bottom:-5px;width:10px;height:10px;background:rgba(255,255,255,.93);transform:rotate(45deg);border-radius:2px}
@keyframes bub{0%{opacity:0;margin-top:10px;scale:.55}14%{opacity:1;margin-top:0;scale:1.06}24%{scale:1}72%{opacity:1}100%{opacity:0;margin-top:-24px}}
@media (prefers-reduced-motion:reduce){#moon,#world,#canopy,.creature{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" aria-hidden="true"></div>
  <div id="moon" aria-hidden="true"><img src="img/moon.png" alt=""></div>
  <div id="birds" aria-hidden="true"></div>
  <canvas id="water" aria-hidden="true"></canvas>
  <div id="world">
    <img id="islandBase" src="img/island-base.png" alt="Lost Island" draggable="false">
    <div id="canopy"><img src="img/tree-canopy.png" alt="" draggable="false"></div>
    <div id="hitDoor" aria-hidden="true"></div>
    <div id="hero" aria-label="Lila Charakter"><canvas id="hero3d"></canvas></div>
    <div class="creature" id="pet"><img src="img/pet.png" alt=""></div>
    <div class="creature" id="squirrel"><img src="img/squirrel.png" alt=""></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<div id="title">Lost Island</div>
<button id="gear" aria-label="Einstellungen" title="Einstellungen">⚙</button>
<div id="panel" role="dialog" aria-label="Einstellungen">
  <div class="row"><span class="lbl">Musik</span><button type="button" id="btnMute">AN</button></div>
  <div class="row"><span class="lbl">Lautstärke</span><input type="range" id="vol" min="0" max="100" value="55"></div>
  <div class="row"><span class="lbl">Pet</span><button type="button" id="btnPet">AUS</button></div>
  <div class="row"><span class="lbl">Eichhörnchen</span><button type="button" id="btnSq">AUS</button></div>
  <div class="hint">Tippe die Insel – Lila läuft hin.<br>Tür antippen – guckt aus dem Leuchtturm.<br>Kein Gewinn/Verlust.</div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const bg=$('bg'), world=$('world'), moon=$('moon'), canopy=$('canopy');
const fx=$('fx'), water=$('water'), cx=fx.getContext('2d'), wx=water.getContext('2d');
const petEl=$('pet'), sqEl=$('squirrel'), panel=$('panel');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=0,H=0,DPR=1,T=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  for(const c of [fx,water]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.getContext('2d').setTransform(DPR,0,0,DPR,0,0)}
}
resize(); addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const SS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---- moon arc (clear, ~55s cycle) ---- */
function moonPos(t){
  const cycle=55;
  const u=(t%cycle)/cycle;
  const ang=Math.PI*(0.08 + u*0.84);
  const rx=W*0.46, ry=Math.max(H*0.18, 90);
  const cx0=W*0.5, cy0=H*0.26;
  return {
    x: cx0 + Math.cos(ang)*rx,
    y: cy0 - Math.sin(ang)*ry,
    s: 0.78 + 0.28*Math.sin(ang),
    a: 0.35 + 0.65*Math.pow(Math.sin(ang), 0.7)
  };
}

/* characters removed */

/* ---- pet / squirrel insertable ---- */
let showPet = LS('lostisland.pet')==='1';
let showSq  = LS('lostisland.sq')==='1';
const petS={x:0.16,y:0.58,tx:0.18,ty:0.56,flip:1,next:1};
const sqS={x:0.33,y:0.36,tx:0.36,ty:0.34,flip:1,next:2,hop:-9};
function syncCreatures(){
  petEl.classList.toggle('on', showPet);
  sqEl.classList.toggle('on', showSq);
  $('btnPet').textContent=showPet?'AN':'AUS';
  $('btnPet').classList.toggle('on', showPet);
  $('btnSq').textContent=showSq?'AN':'AUS';
  $('btnSq').classList.toggle('on', showSq);
}
syncCreatures();
function newPetT(t){ petS.tx=rnd(0.10,0.36); petS.ty=rnd(0.52,0.68); petS.next=t+rnd(3.5,7); }
function newSqT(t){ sqS.tx=rnd(0.28,0.48); sqS.ty=rnd(0.30,0.42); sqS.next=t+rnd(2.5,5.5); sqS.hop=t; }

/* ---- ambient particles ---- */
const insects=[];
for(let i=0;i<10;i++) insects.push({
  x:rnd(0.15,0.85), y:rnd(0.15,0.55), ph:rnd(0,6.3), sp:rnd(0.02,0.04),
  kind: Math.random()<.55?'moth':'bee', pathT:rnd(0,10)
});
const sparks=[];
for(let i=0;i<36;i++) sparks.push({x:Math.random(),y:Math.random()*0.55,ph:rnd(0,6),s:rnd(0.4,1.3)});
const parts=[]; // reaction bursts
function burst(x,y,n){
  const cols=['#e8f0ff','#ffe9a8','#c8e0ff','#ffd0e8','#d0f0c8'];
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), v=rnd(40,160);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:0,max:rnd(0.5,1.1),r:rnd(2,5.5),c:cols[i%cols.length]});
  }
}

/* V-birds */
const birdBox=$('birds');
const birds=[];
for(let i=0;i<4;i++){
  const d=document.createElement('div'); d.className='vbird'; d.textContent='ᵛ';
  birdBox.appendChild(d);
  birds.push({el:d, x:rnd(0.05,0.7), y:0.08+i*0.035, ph:i*1.4, sp:0.012+i*0.003});
}

/* ---- audio: deeper melancholic pad ---- */
let AC=null, master=null, muted=LS('lostisland.mute')==='1';
let vol=parseFloat(LS('lostisland.vol')||'0.55');
$('vol').value=String(Math.round(vol*100));
$('btnMute').textContent=muted?'AUS':'AN';
function applyGain(){ if(master) master.gain.value = muted?0:vol*0.38; }
function ensureAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); applyGain(); master.connect(AC.destination);
  // deep pad: A minor-ish cluster with slow filter breathe
  const freqs=[55, 82.41, 110, 164.81, 196, 261.63]; // A1 E2 A2 E3 G3 C4
  freqs.forEach((f,i)=>{
    const o=AC.createOscillator();
    o.type = i<2 ? 'sine' : (i<4 ? 'triangle' : 'sine');
    o.frequency.value=f;
    o.detune.value = (i%2? -6: 5);
    const g=AC.createGain(); g.gain.value = (0.09/(1+i*0.55));
    const ftr=AC.createBiquadFilter(); ftr.type='lowpass'; ftr.Q.value=0.6;
    ftr.frequency.value=480;
    // slow filter LFO
    const lfo=AC.createOscillator(); lfo.frequency.value=0.04+i*0.011;
    const lg=AC.createGain(); lg.gain.value=220;
    lfo.connect(lg); lg.connect(ftr.frequency);
    // amp breathe
    const lfo2=AC.createOscillator(); lfo2.frequency.value=0.05+i*0.02;
    const lg2=AC.createGain(); lg2.gain.value=g.gain.value*0.35;
    lfo2.connect(lg2); lg2.connect(g.gain);
    o.connect(ftr); ftr.connect(g); g.connect(master);
    o.start(); lfo.start(); lfo2.start();
  });
  // quiet high mournful voice
  const oH=AC.createOscillator(); oH.type='sine'; oH.frequency.value=329.63;
  const gH=AC.createGain(); gH.gain.value=0.018;
  const fH=AC.createBiquadFilter(); fH.type='lowpass'; fH.frequency.value=900;
  oH.connect(fH); fH.connect(gH); gH.connect(master); oH.start();
}
function softPing(id){
  if(!AC||muted) return;
  const t0=AC.currentTime;
  const base = id==='door'? 392 : id==='bench'? 330 : 440;
  const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(base, t0);
  o.frequency.exponentialRampToValueAtTime(base*0.45, t0+0.5);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.07*vol, t0+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.55);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.6);
}

/* settings UI */
$('gear').addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation();
  panel.classList.toggle('open'); ensureAudio();
},{passive:false});
$('btnMute').addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation();
  muted=!muted; SS('lostisland.mute', muted?'1':'0');
  $('btnMute').textContent=muted?'AUS':'AN'; applyGain(); ensureAudio();
},{passive:false});
$('vol').addEventListener('input', e=>{
  vol=clamp(parseInt(e.target.value,10)/100,0,1); SS('lostisland.vol', String(vol));
  if(vol>0 && muted){ muted=false; SS('lostisland.mute','0'); $('btnMute').textContent='AN'; }
  applyGain(); ensureAudio();
});
$('btnPet').addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation();
  showPet=!showPet; SS('lostisland.pet', showPet?'1':'0'); syncCreatures();
  if(showPet){ newPetT(T); ensureAudio(); softPing('grass'); }
},{passive:false});
$('btnSq').addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation();
  showSq=!showSq; SS('lostisland.sq', showSq?'1':'0'); syncCreatures();
  if(showSq){ newSqT(T); ensureAudio(); softPing('bench'); }
},{passive:false});
document.addEventListener('pointerdown', e=>{
  if(panel.contains(e.target) || e.target===$('gear') || e.target.closest('#panel')){
    if(e.target===$('gear')||panel.contains(e.target)) {/* settings handlers separately */}
    else panel.classList.remove('open');
    return;
  }
  if(!panel.contains(e.target) && e.target!==$('gear')) panel.classList.remove('open');
  ensureAudio();
  if(window.LostIslandTap) window.LostIslandTap(e.clientX, e.clientY);
},{passive:false});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>{
  document.addEventListener(ev, e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});
});

/* ---- water ripples over pond region ---- */
function worldRect(){ return world.getBoundingClientRect(); }
function pondBox(wr){
  // pond is lower-left of island art
  return {
    x: wr.left + wr.width*0.10,
    y: wr.top  + wr.height*0.55,
    w: wr.width*0.24,
    h: wr.height*0.14
  };
}

/* ---- main loop ---- */
let last=performance.now();
newPetT(0); newSqT(0);

function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  const wr=worldRect();

  // parallax bg drift
  if(!reduced){
    const px=Math.sin(T*0.07)*10, py=Math.cos(T*0.05)*6;
    bg.style.transform=`translate(${px.toFixed(2)}px,${py.toFixed(2)}px)`;
  }

  // island float + slight sway
  if(!reduced){
    const bob=Math.sin(T*0.5)*4.2, sway=Math.sin(T*0.28)*0.4;
    world.style.transform=`translate(-50%,-50%) translateY(${bob.toFixed(2)}px) rotate(${sway.toFixed(3)}deg)`;
  }

  // REAL canopy sway (separate layer)
  if(!reduced){
    const ang=Math.sin(T*0.9)*3.8 + Math.sin(T*1.7)*1.4;
    const sc=1 + Math.sin(T*1.1)*0.012;
    canopy.style.transform=`rotate(${ang.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  }

  // moon
  const m=moonPos(T);
  const mw=moon.offsetWidth||100;
  moon.style.transform=`translate(${(m.x-mw/2).toFixed(1)}px,${(m.y-mw/2).toFixed(1)}px) scale(${m.s.toFixed(3)})`;
  moon.style.opacity=m.a.toFixed(3);


  // pet roam
  if(showPet){
    if(T>petS.next) newPetT(T);
    petS.x+=(petS.tx-petS.x)*Math.min(1,dt*0.4);
    petS.y+=(petS.ty-petS.y)*Math.min(1,dt*0.4);
    if(Math.abs(petS.tx-petS.x)>0.003) petS.flip=petS.tx>petS.x?1:-1;
    const bob=Math.sin(T*2.4)*2;
    petEl.style.left=(petS.x*100).toFixed(2)+'%';
    petEl.style.top=(petS.y*100).toFixed(2)+'%';
    petEl.style.transform=`scaleX(${petS.flip}) translateY(${bob.toFixed(1)}px)`;
  }
  // squirrel
  if(showSq){
    if(T>sqS.next) newSqT(T);
    sqS.x+=(sqS.tx-sqS.x)*Math.min(1,dt*0.55);
    sqS.y+=(sqS.ty-sqS.y)*Math.min(1,dt*0.55);
    if(Math.abs(sqS.tx-sqS.x)>0.003) sqS.flip=sqS.tx>sqS.x?1:-1;
    let hop=0;
    if(sqS.hop>=0 && T-sqS.hop<0.5) hop=-Math.sin(((T-sqS.hop)/0.5)*Math.PI)*12;
    sqEl.style.left=(sqS.x*100).toFixed(2)+'%';
    sqEl.style.top=(sqS.y*100).toFixed(2)+'%';
    sqEl.style.transform=`scaleX(${sqS.flip}) translateY(${hop.toFixed(1)}px)`;
  }

  // birds
  birds.forEach(b=>{
    b.x+=b.sp*dt; if(b.x>1.15){ b.x=-0.1; b.y=rnd(0.06,0.22); }
    const y=b.y+Math.sin(T*0.9+b.ph)*0.018;
    b.el.style.transform=`translate(${(b.x*W).toFixed(1)}px,${(y*H).toFixed(1)}px) scaleX(${b.sp>0?1:-1})`;
  });

  /* water canvas */
  wx.clearRect(0,0,W,H);
  if(wr.width>40){
    const p=pondBox(wr);
    // soft clip oval
    wx.save();
    wx.beginPath();
    wx.ellipse(p.x+p.w/2, p.y+p.h/2, p.w/2, p.h/2, 0, 0, 7);
    wx.clip();
    // base shimmer fill
    wx.fillStyle='rgba(180,220,255,0.06)';
    wx.fillRect(p.x,p.y,p.w,p.h);
    // ripple waves
    for(let i=0;i<7;i++){
      const phase=T*1.5+i*0.85;
      wx.strokeStyle=`rgba(210,235,255,${0.10+0.12*((Math.sin(phase)+1)*0.5)})`;
      wx.lineWidth=1.3;
      wx.beginPath();
      const yy=p.y+p.h*(0.15+i*0.12);
      for(let x=0;x<=p.w;x+=3){
        const px=p.x+x;
        const py=yy+Math.sin(x*0.09+phase)*2.4 + Math.sin(x*0.03+phase*0.6)*1.2;
        if(x===0) wx.moveTo(px,py); else wx.lineTo(px,py);
      }
      wx.stroke();
    }
    // specular dots
    for(let i=0;i<5;i++){
      const sx=p.x+p.w*(0.2+0.12*i)+Math.sin(T*2+i)*6;
      const sy=p.y+p.h*0.35+Math.cos(T*1.7+i)*4;
      wx.fillStyle=`rgba(255,255,255,${0.15+0.2*((Math.sin(T*3+i)+1)*0.5)})`;
      wx.beginPath(); wx.arc(sx,sy,1.6,0,7); wx.fill();
    }
    wx.restore();

    // reed / plant bend near pond
    wx.save();
    for(let i=0;i<5;i++){
      const bx=p.x+p.w*0.08+i*p.w*0.1;
      const by=p.y+p.h*0.92;
      const ang=Math.sin(T*1.5+i*0.9)*0.22;
      wx.strokeStyle='rgba(90,120,70,0.35)';
      wx.lineWidth=1.6;
      wx.beginPath();
      wx.moveTo(bx,by);
      const tipX=bx+Math.sin(ang)*16;
      const tipY=by-28-i*2;
      wx.quadraticCurveTo(bx+Math.sin(ang)*6, by-14, tipX, tipY);
      wx.stroke();
      // seed head
      wx.fillStyle='rgba(120,90,50,0.45)';
      wx.beginPath(); wx.ellipse(tipX, tipY, 2.2, 3.5, ang, 0, 7); wx.fill();
    }
    // small bush near lighthouse sway hint
    const bushX=wr.left+wr.width*0.82, bushY=wr.top+wr.height*0.48;
    for(let i=0;i<6;i++){
      const a=T*1.2+i;
      wx.strokeStyle=`rgba(70,110,70,${0.2})`;
      wx.beginPath();
      wx.moveTo(bushX+i*4, bushY+10);
      wx.quadraticCurveTo(bushX+i*4+Math.sin(a)*5, bushY-8, bushX+i*4+Math.sin(a)*8, bushY-20);
      wx.stroke();
    }
    wx.restore();
  }

  /* fx canvas: insects + sparks + bursts */
  cx.clearRect(0,0,W,H);
  // star twinkles
  sparks.forEach(s=>{
    const a=0.12+0.55*((Math.sin(T*s.s+s.ph)+1)*0.5);
    cx.fillStyle=`rgba(230,236,255,${a*0.5})`;
    cx.beginPath(); cx.arc(s.x*W, s.y*H, s.s*1.3, 0, 7); cx.fill();
  });
  // insects with curved paths
  insects.forEach(bug=>{
    bug.pathT+=dt;
    const ox=Math.sin(bug.pathT*bug.sp*8+bug.ph)*0.12;
    const oy=Math.cos(bug.pathT*bug.sp*6+bug.ph*1.3)*0.08;
    let x=bug.x+ox, y=bug.y+oy;
    x=clamp(x,0.05,0.95); y=clamp(y,0.08,0.7);
    // slow drift of home
    bug.x+=Math.sin(T*0.15+bug.ph)*0.0008;
    bug.y+=Math.cos(T*0.12+bug.ph)*0.0005;
    const px=x*W, py=y*H;
    const flap=0.5+0.5*Math.sin(T*16+bug.ph);
    cx.save(); cx.translate(px,py);
    if(bug.kind==='moth'){
      cx.fillStyle=`rgba(235,215,160,${0.35+0.3*flap})`;
      cx.beginPath(); cx.ellipse(-4*flap,0,4.2,2.4,-0.5,0,7); cx.fill();
      cx.beginPath(); cx.ellipse(4*flap,0,4.2,2.4,0.5,0,7); cx.fill();
      cx.fillStyle='rgba(40,35,25,.55)'; cx.beginPath(); cx.arc(0,0,1.4,0,7); cx.fill();
    }else{
      cx.fillStyle=`rgba(60,50,30,${0.45+0.25*flap})`;
      cx.beginPath(); cx.ellipse(0,0,3,2.2,0,0,7); cx.fill();
      cx.strokeStyle=`rgba(200,190,140,${0.35+0.3*flap})`;
      cx.beginPath(); cx.moveTo(-1,0); cx.quadraticCurveTo(-7,-6*flap,-5,-2); cx.stroke();
      cx.beginPath(); cx.moveTo(1,0); cx.quadraticCurveTo(7,-6*flap,5,-2); cx.stroke();
    }
    cx.restore();
  });
  // leaf fall near canopy
  if(wr.width>40){
    for(let i=0;i<5;i++){
      const a=T*0.4+i*1.3;
      const lx=wr.left+wr.width*(0.18+0.08*i)+Math.sin(a)*20;
      const ly=wr.top+wr.height*(0.22+(a%3)*0.05);
      cx.fillStyle=`rgba(130,160,100,${0.18+0.1*Math.sin(a)})`;
      cx.beginPath(); cx.ellipse(lx, ly, 3.2, 5, Math.sin(a)*0.8, 0, 7); cx.fill();
    }
  }
  // bursts
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.life+=dt;
    if(q.life>q.max){ parts.splice(i,1); continue; }
    q.vx*=Math.pow(0.12,dt); q.vy=q.vy*Math.pow(0.12,dt)+40*dt;
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    const a=1-q.life/q.max; cx.globalAlpha=a; cx.fillStyle=q.c;
    cx.beginPath(); cx.arc(q.x,q.y,q.r*(0.5+a*0.5),0,7); cx.fill();
    cx.globalAlpha=1;
  }


  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
}
})();
</script>

<script type="module">
import { createHero } from './hero.js?v=5';

const world = document.getElementById('world');
const heroEl = document.getElementById('hero');
const canvas = document.getElementById('hero3d');
const hero = createHero(canvas);

// Island walkable UV (fractions of #world)
const GRASS = {u0:0.14, u1:0.86, v0:0.36, v1:0.62};
const DOOR  = {u0:0.62, u1:0.78, v0:0.40, v1:0.60}; // lighthouse door
const START = {u:0.46, v:0.52};

const state = {
  u: START.u, v: START.v,
  tu: START.u, tv: START.v,
  walking: false, sit: false, peek: false,
  mode: 'idle', // idle | walk | peek
  speed: 0, t: 0
};

function resizeHero(){
  const r = heroEl.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  hero.resize(Math.max(2, r.width), Math.max(2, r.height), dpr);
}
resizeHero();
addEventListener('resize', resizeHero);

function placeHero(){
  heroEl.style.left = (state.u * 100).toFixed(2) + '%';
  heroEl.style.top  = (state.v * 100).toFixed(2) + '%';
  // slight size by depth (v)
  const s = 0.92 + (state.v - 0.4) * 0.5;
  const facing = heroEl.dataset.facing || '1';
  heroEl.style.transform = `translate(-50%,-72%) scale(${s.toFixed(3)})`;
}

function uvFromClient(cx, cy){
  const r = world.getBoundingClientRect();
  return {
    u: (cx - r.left) / r.width,
    v: (cy - r.top) / r.height,
    inWorld: cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom
  };
}
function inBox(u,v,b){ return u>=b.u0 && u<=b.u1 && v>=b.v0 && v<=b.v1; }

function goWalk(u, v){
  u = Math.min(GRASS.u1, Math.max(GRASS.u0, u));
  v = Math.min(GRASS.v1, Math.max(GRASS.v0, v));
  state.tu = u; state.tv = v;
  state.mode = 'walk';
  state.walking = true;
  state.sit = false;
  state.peek = false;
  const dx = u - state.u;
  if (Math.abs(dx) > 0.002) {
    hero.setFacing(dx);
    heroEl.dataset.facing = dx >= 0 ? '1' : '-1';
  }
}
function goPeek(){
  // walk toward door then peek
  state.tu = (DOOR.u0 + DOOR.u1) / 2;
  state.tv = (DOOR.v0 + DOOR.v1) / 2 + 0.02;
  state.mode = 'toPeek';
  state.walking = true;
  state.sit = false;
  state.peek = false;
  hero.setFacing(1);
  heroEl.dataset.facing = '1';
}

window.LostIslandTap = function(cx, cy){
  const p = uvFromClient(cx, cy);
  if (!p.inWorld) return;
  // door / lighthouse hit?
  if (inBox(p.u, p.v, DOOR) || (p.u > 0.66 && p.u < 0.82 && p.v > 0.28 && p.v < 0.62)) {
    goPeek();
    return;
  }
  // anywhere on island box → walk (clamp to grass)
  if (p.u > 0.08 && p.u < 0.92 && p.v > 0.28 && p.v < 0.72) {
    goWalk(p.u, p.v);
  }
};

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  state.t += dt;

  if (state.walking || state.mode === 'toPeek' || state.mode === 'walk') {
    const dx = state.tu - state.u;
    const dy = state.tv - state.v;
    const dist = Math.hypot(dx, dy);
    const spd = (state.mode === 'toPeek' ? 0.55 : 0.42); // units per sec in UV
    if (dist < 0.008) {
      state.u = state.tu; state.v = state.tv;
      state.walking = false;
      if (state.mode === 'toPeek') {
        state.mode = 'peek';
        state.peek = true;
        state.sit = false;
      } else {
        state.mode = 'idle';
        state.peek = false;
        state.sit = Math.random() < 0.45; // sometimes sit after arrive
      }
      state.speed = 0;
    } else {
      const step = Math.min(dist, spd * dt);
      state.u += (dx / dist) * step;
      state.v += (dy / dist) * step;
      state.walking = true;
      state.speed = spd;
      state.peek = false;
      if (Math.abs(dx) > 0.001) {
        hero.setFacing(dx);
        heroEl.dataset.facing = dx >= 0 ? '1' : '-1';
      }
    }
  }

  placeHero();
  hero.update(dt, {
    walking: state.walking,
    speed: state.speed,
    sit: state.sit,
    peek: state.peek,
    t: state.t
  });
  requestAnimationFrame(loop);
}
placeHero();
requestAnimationFrame(loop);

// expose for debugging
window.LostHeroState = state;
</script>
