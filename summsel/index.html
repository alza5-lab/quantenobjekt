<div id="n">Summsel</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const S=document.getElementById('s'),IN=document.getElementById('in'),SH=document.getElementById('sh');
let W=0,H=0,DPR=1,size=180;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);
  size=Math.round(Math.max(110,Math.min(W*.42,H*.30,240)));
  document.documentElement.style.setProperty('--w',size+'px');
}
resize();addEventListener('resize',resize);
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Zustand
const p={x:W/2,y:H*.45,vx:0,vy:0,tx:W/2,ty:H*.45,nextT:0,tilt:0,spin:0,spinV:0,spinT:0,hop:0,hopT:-9,boost:0,arrive:false};
function bounds(){const m=size*.6;return{x0:m,x1:Math.max(m,W-m),y0:m*.9,y1:Math.max(m,H-m*1.1)}}
function newTarget(t){const b=bounds();p.tx=rnd(b.x0,b.x1);p.ty=rnd(b.y0,b.y1);p.nextT=t+rnd(2.5,5.5);p.boost=0;p.arrive=false}
// Partikel
const parts=[];
function sparkle(x,y,n,spd){
  const cols=['#d9ef5a','#f7e36b','#bfe3ff','#ffd1ec','#c8f7d0','#ffffff'];
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,life:0,max:rnd(.6,1.2),r:rnd(3.5,8),c:cols[i%cols.length],star:Math.random()<.55,rot:rnd(0,6)})}
}
const pollen=[];for(let i=0;i<18;i++)pollen.push({x:Math.random(),y:Math.random(),r:rnd(1.5,4),s:rnd(.004,.012),ph:rnd(0,6)});
function star(x,y,r,rot){cx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.42:r,a=rot+i*Math.PI/4;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.closePath();cx.fill()}
// Sprechblase
const words=['summ!','summ summ!','hihi!','huiii!','bzzz!','hallo!','summ?'];
let lastBub=0;
function bubble(t,txt){
  if(t-lastBub<.6)return;lastBub=t;
  const d=document.createElement('div');d.className='bub';d.textContent=txt||words[Math.floor(Math.random()*words.length)];
  const right=p.x<W*.6;
  d.style.left=(p.x+(right?size*.42:-size*.42))+'px';d.style.top=(p.y-size*.42)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1600);
}
// Interaktion
let T=0;
function tap(x,y){
  sparkle(x,y,14,140);
  const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy)||1;
  if(d<size*.75){ // ausweichen + Looping
    const a=Math.atan2(dy,dx)+Math.PI+rnd(-.6,.6);
    p.vx+=Math.cos(a)*520;p.vy+=Math.sin(a)*520-120;
    const b=bounds();p.tx=clamp(p.x+Math.cos(a)*size*1.6,b.x0,b.x1);p.ty=clamp(p.y+Math.sin(a)*size*1.6,b.y0,b.y1);
    p.nextT=T+2.5;p.boost=1.2;p.arrive=false;
    p.spinT=T;p.spinDir=(dx>0?-1:1);
    sparkle(p.x,p.y,10,180);bubble(T);
  }else{ // hinfliegen, dann Hüpfer oder Looping
    const b=bounds();p.tx=clamp(x,b.x0,b.x1);p.ty=clamp(y,b.y0,b.y1);
    p.nextT=T+4;p.boost=1.6;p.arrive=true;
  }
  S.classList.add('fast');clearTimeout(tap.tm);tap.tm=setTimeout(()=>S.classList.remove('fast'),1400);
}
const opt={passive:false};
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>{if(ev.cancelable)ev.preventDefault()},opt));
document.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)},opt);
// Schleife
let last=performance.now();newTarget(0);
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(T>p.nextT)newTarget(T);
  // Steuern
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
  const maxV=p.boost>0?380:85, acc=p.boost>0?900:120;
  if(d>2){const dv=Math.min(1,d/(p.boost>0?60:120));
    const wx=dx/d*maxV*dv,wy=dy/d*maxV*dv;
    const k=Math.min(1,dt*(p.boost>0?6:3));p.vx+=clamp(wx-p.vx,-acc*dt*4,acc*dt*4)*k;p.vy+=clamp(wy-p.vy,-acc*dt*4,acc*dt*4)*k;}
  // sanftes Schweben (Wackel-Wind)
  p.vx+=Math.sin(T*.7+1.3)*6*dt;p.vy+=Math.cos(T*.9)*6*dt;
  p.vx*=Math.pow(.6,dt);p.vy*=Math.pow(.6,dt);
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const b=bounds();
  if(p.x<b.x0){p.x=b.x0;p.vx=Math.abs(p.vx)*.5}if(p.x>b.x1){p.x=b.x1;p.vx=-Math.abs(p.vx)*.5}
  if(p.y<b.y0){p.y=b.y0;p.vy=Math.abs(p.vy)*.5}if(p.y>b.y1){p.y=b.y1;p.vy=-Math.abs(p.vy)*.5}
  if(p.boost>0){p.boost-=dt;if(Math.random()<.5)sparkle(p.x+rnd(-size*.2,size*.2),p.y+size*.25,1,40);
    if(p.arrive&&d<size*.25){p.arrive=false;p.boost=0;
      if(Math.random()<.5){p.spinT=T;p.spinDir=Math.random()<.5?-1:1}else{p.hopT=T}
      sparkle(p.x,p.y,12,160);bubble(T);p.nextT=T+rnd(1.8,3)}}
  // Neigung in Flugrichtung
  p.tilt+=(clamp(p.vx*.06,-16,16)-p.tilt)*Math.min(1,dt*5);
  // Looping
  let spin=0,loopY=0;const st=T-p.spinT;
  if(st>=0&&st<.85){const k=st/.85,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;spin=e*360*p.spinDir;loopY=-Math.sin(k*Math.PI)*size*.35}
  // Hüpfer
  let hopY=0,sq=1;const ht=T-p.hopT;
  if(ht>=0&&ht<.7){const k=ht/.7;hopY=-Math.sin(k*Math.PI)*size*.45;sq=k<.12?1-.15*Math.sin(k/.12*Math.PI):(k>.85?1-.1*Math.sin((k-.85)/.15*Math.PI):1)}
  const bob=Math.sin(T*2.3)*size*.045+Math.sin(T*5.1)*size*.012;
  const wob=1+Math.sin(T*7)*.012;
  const X=p.x-size/2,Y=p.y-size*.51+bob+loopY+hopY;
  S.style.transform=`translate3d(${X.toFixed(1)}px,${Y.toFixed(1)}px,0)`;
  IN.style.transform=`rotate(${(p.tilt+spin).toFixed(2)}deg) scale(${(wob*(2-sq)).toFixed(3)},${(sq/wob).toFixed(3)})`;
  const lift=clamp((Y+size)/H,0,1);
  SH.style.transform=`translate3d(${(p.x-size/2).toFixed(1)}px,${(H-size*.18-0*lift).toFixed(1)}px,0) scale(${(.5+lift*.5).toFixed(3)})`;
  SH.style.opacity=(.35+lift*.65).toFixed(2);
  // Hintergrund + Partikel
  cx.clearRect(0,0,W,H);
  for(const q of pollen){q.y-=q.s*dt*3;if(q.y<-.05)q.y=1.05;const xx=(q.x+Math.sin(T*.3+q.ph)*.02)*W;
    cx.fillStyle='rgba(205,225,120,.28)';cx.beginPath();cx.arc(xx,q.y*H,q.r,0,7);cx.fill()}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;if(q.life>q.max){parts.splice(i,1);continue}
    q.vx*=Math.pow(.15,dt);q.vy=q.vy*Math.pow(.15,dt)+30*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=dt*3;
    const a=1-q.life/q.max;cx.globalAlpha=a;cx.fillStyle=q.c;
    if(q.c==='#ffffff'){cx.strokeStyle='rgba(200,215,120,.6)';}
    if(q.star)star(q.x,q.y,q.r*(.6+a*.6),q.rot);else{cx.beginPath();cx.arc(q.x,q.y,q.r*.6,0,7);cx.fill()}
    cx.globalAlpha=1}
  // gelegentlich von allein
  if(Math.random()<dt/25)bubble(T,'summ…');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
}
})();
</script>
